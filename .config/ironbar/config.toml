# ironbar config — initial draft, staged 2026-08-10
#
# Built to match the existing rice's aesthetic (Material-You purple/lavender scheme,
# generated from .config/hypr/scheme/current.lua in dot-files) and its philosophy
# (waybar/ironbar were picked over caelestia/HyprPanel specifically because this M1 is
# a reliability-first schoolday machine, not a rice project — kept the module list short
# on purpose).
#
# Caveat: written against ironbar 0.19.0 (the version currently in the
# victorvintorez/packages COPR) without a live install to test against. If a module key
# fails validation, check `ironbar --help` / the upstream docs — module schemas have
# shifted across ironbar releases before. Verify, don't assume this is correct out of the box.

position = "top"
height = 36
icon_theme = "Papirus-Dark"

[[start]]
type = "workspaces"

[[center]]
type = "clock"
format = "%a %d %b   %H:%M"

[[end]]
type = "sys_info"
format = ["{cpu_percent}%", "{memory_percent}%"]

[end.interval]
cpu = 3
memory = 5

[[end]]
type = "volume"

[[end]]
type = "upower"

[[end]]
type = "tray"
