# ironbar config — top bar only: time/date, power, wifi, input method (keyboard layout), cpu/mem.
# Verified against the real module docs shipped with ironbar 0.19.0
# (/usr/share/doc/ironbar/docs/modules/*.md) — this is not a guess like the first draft was.
#
# Requires: NetworkManager (active), upower (active), user in the `input` group for the
# keyboard layout indicator (added via `usermod -aG input` — needs a session restart to
# take effect).

position = "top"
height = 36
icon_theme = "Papirus-Dark"

[[center]]
type = "clock"
format = "%a %d %b   %H:%M"

[[end]]
type = "sys_info"
format = ["{cpu_percent}%", "{memory_percent}%"]

[end.interval]
cpu = 3
memory = 5

[[end]]
type = "network_manager"

[[end]]
type = "keyboard"
show_caps = false
show_num = false
show_scroll = false

[[end]]
type = "battery"
format = "{percentage}%"
