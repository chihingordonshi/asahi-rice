# Minimal, hand-written hyprland.conf — 2026-08-10
#
# The dot-files repo's hyprland.lua is the unfilled autogenerated Lua stub (it
# require()s monitors/programs/autostart/etc. files that were never committed), so it
# was not usable as-is. Wrote this from scratch in the standard hyprlang syntax instead
# of chasing the Lua config path, matching this machine's reliability-first goal.
# Colors match the Material-You scheme in .config/hypr/scheme/current.lua.

monitor = , preferred, auto, auto

$terminal = kitty
$menu = wofi --show drun
$mainMod = SUPER

exec-once = ironbar

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c2c1ffee)
    col.inactive_border = rgba(47464faa)
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# core bindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
