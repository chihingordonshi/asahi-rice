general {
    lock_cmd = pidof hyprlock || hyprlock            # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake screen on resume
}

listener {
    timeout = 900                                     # 15min
    on-timeout = loginctl lock-session
}

# Keep the display awake while idle. The session still locks after 15 minutes.
