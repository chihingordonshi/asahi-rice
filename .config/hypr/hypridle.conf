# Verified against the shipped /usr/share/doc/hypridle/example.conf for this machine's
# Hyprland build (hyprctl dispatch args are Lua expressions here, hence hl.dsp.dpms(...)
# rather than the plain `dpms on/off` seen in generic hypridle docs).
#
# Autolock only -- no manual lock button/keybind, this is the sole way to lock.

general {
    lock_cmd = pidof hyprlock || hyprlock            # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake screen on resume
}

listener {
    timeout = 900                                     # 15min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 930                                                      # 15.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'      # screen off shortly after lock
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
