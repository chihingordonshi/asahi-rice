# Cursor-centric zoom: point at an area and use Ctrl + mouse wheel.
Ctrl+WHEEL_UP   script-binding positioning/cursor-centric-zoom+0.10
Ctrl+WHEEL_DOWN script-binding positioning/cursor-centric-zoom-0.10

# Keyboard zoom and reset.
Alt++           add video-zoom 0.10
Alt+-           add video-zoom -0.10
Alt+BS          set video-zoom 0; set video-pan-x 0; set video-pan-y 0

# Pan while zoomed.
Alt+LEFT        add video-pan-x 0.05
Alt+RIGHT       add video-pan-x -0.05
Alt+UP          add video-pan-y 0.05
Alt+DOWN        add video-pan-y -0.05
