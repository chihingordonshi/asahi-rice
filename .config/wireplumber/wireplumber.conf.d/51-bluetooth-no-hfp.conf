monitor.bluez.properties = {
  # AirPods (and many BT headsets) get stuck in a connect->HFP-negotiation-
  # failure->disconnect loop when hfp_ag/hfp_hf/hsp are enabled. HFP mic
  # quality is unusable anyway (8kHz), so just do A2DP (+ LE audio).
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
