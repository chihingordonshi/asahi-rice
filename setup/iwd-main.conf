# Standalone iwd: no NetworkManager, networkd or separate DHCP client on Wi-Fi.
[General]
EnableNetworkConfiguration=true
AddressRandomization=network

[Network]
NameResolvingService=systemd
EnableIPv6=true

# Retain automatic reconnection and roaming; scan less often when disconnected.
[Scan]
InitialPeriodicScanInterval=30
MaximumPeriodicScanInterval=300

# Preserve the Asahi Broadcom interface rather than deleting/recreating it.
[DriverQuirks]
DefaultInterface=brcmfmac
