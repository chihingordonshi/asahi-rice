[General]
DisplayServer=wayland
InputMethod=

[Theme]
ThemeDir=/usr/local/share/sddm/themes
Current=macos
Font=Inter
CursorTheme=Adwaita
CursorSize=24

[Wayland]
CompositorCommand=/usr/bin/weston --shell=kiosk --config=/etc/sddm/weston.ini
EnableHiDPI=true

[Users]
RememberLastUser=true
RememberLastSession=true
